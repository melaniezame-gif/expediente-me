<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="1100" fill="#f7f5f2"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#111827">Vitalis · Week 5 wireframe — /chat guided assistant (desktop left, mobile right)</text>
  <text x="40" y="78" font-size="16" fill="#6b7280">Low-fidelity UX concept drawn before coding. Grey bubble = assistant, green bubble = user, slate = guardrail, red = emergency, dashed = live data from Supabase.</text>

  <!-- ===== DESKTOP ===== -->
  <g transform="translate(40,100)">
    <rect width="1080" height="970" rx="14" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
    <rect width="1080" height="44" rx="14" fill="#f3f4f6"/>
    <text x="20" y="28" font-size="16" font-weight="700" fill="#111827">● Vitalis</text>
    <text x="560" y="28" font-size="13" fill="#6b7280">How it works · Triage · Chat · Research · Product · Pricing · Marketing · Docs</text>
    <text x="24" y="80" font-size="12" font-weight="700" fill="#047857">WEEK 5 · PUBLIC CHATBOT / GUIDED ASSISTANT</text>
    <rect x="24" y="90" width="360" height="22" rx="4" fill="#111827"/>
    <rect x="24" y="120" width="560" height="10" rx="3" fill="#d1d5db"/>

    <!-- chat panel -->
    <rect x="24" y="148" width="640" height="800" rx="12" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
    <rect x="24" y="148" width="640" height="52" rx="12" fill="#f9fafb"/>
    <text x="44" y="172" font-size="15" font-weight="700" fill="#111827">Vitalis Guide</text>
    <text x="44" y="190" font-size="11" fill="#6b7280">Automated guide · not a doctor · emergencies: 911</text>
    <rect x="452" y="160" width="120" height="28" rx="14" fill="#fff" stroke="#111827"/>
    <text x="468" y="179" font-size="12" font-weight="700" fill="#111827">Talk to a person</text>
    <rect x="580" y="160" width="70" height="28" rx="14" fill="#fff" stroke="#d1d5db"/>
    <text x="596" y="179" font-size="12" fill="#374151">Restart</text>

    <!-- bot Q1 -->
    <rect x="44" y="218" width="380" height="56" rx="12" fill="#f3f4f6"/>
    <text x="58" y="240" font-size="12" fill="#111827">Q1 · Who is this check for?</text>
    <rect x="58" y="248" width="70" height="20" rx="10" fill="#fff" stroke="#047857"/>
    <text x="72" y="262" font-size="11" fill="#047857">Me</text>
    <rect x="134" y="248" width="140" height="20" rx="10" fill="#fff" stroke="#047857"/>
    <text x="146" y="262" font-size="11" fill="#047857">Someone I care for</text>
    <rect x="474" y="284" width="170" height="30" rx="12" fill="#047857"/>
    <text x="490" y="304" font-size="12" fill="#fff">Someone I care for</text>

    <!-- Q2 / Q3 -->
    <rect x="44" y="324" width="380" height="34" rx="12" fill="#f3f4f6"/>
    <text x="58" y="346" font-size="12" fill="#111827">Q2 · Age group?  [18–64] [65+] [Under 18]</text>
    <rect x="574" y="366" width="70" height="30" rx="12" fill="#047857"/>
    <text x="594" y="386" font-size="12" fill="#fff">65+</text>
    <rect x="44" y="406" width="430" height="58" rx="12" fill="#f3f4f6"/>
    <text x="58" y="428" font-size="12" fill="#111827">Q3 · Is any of this happening right now?</text>
    <text x="58" y="450" font-size="11" fill="#6b7280">[Chest pain] [Can't breathe] [Fainting/confused] [Stroke signs] [None]</text>
    <rect x="584" y="472" width="60" height="30" rx="12" fill="#047857"/>
    <text x="598" y="492" font-size="12" fill="#fff">None</text>

    <!-- vitals form -->
    <rect x="44" y="512" width="430" height="96" rx="12" fill="#f3f4f6"/>
    <text x="58" y="534" font-size="12" fill="#111827">Now the 4 readings (or type "38.5 110 93 6")</text>
    <rect x="58" y="544" width="92" height="26" rx="6" fill="#fff" stroke="#d1d5db"/><text x="66" y="561" font-size="10" fill="#9ca3af">°C</text>
    <rect x="156" y="544" width="92" height="26" rx="6" fill="#fff" stroke="#d1d5db"/><text x="164" y="561" font-size="10" fill="#9ca3af">bpm</text>
    <rect x="254" y="544" width="92" height="26" rx="6" fill="#fff" stroke="#d1d5db"/><text x="262" y="561" font-size="10" fill="#9ca3af">SpO₂ %</text>
    <rect x="352" y="544" width="92" height="26" rx="6" fill="#fff" stroke="#d1d5db"/><text x="360" y="561" font-size="10" fill="#9ca3af">pain 0–10</text>
    <rect x="58" y="578" width="90" height="22" rx="6" fill="#047857"/><text x="70" y="593" font-size="11" fill="#fff">Continue</text>
    <text x="160" y="593" font-size="11" fill="#6b7280">I don't have readings</text>

    <!-- checkpoint -->
    <rect x="44" y="620" width="430" height="92" rx="12" fill="#fff" stroke="#111827" stroke-width="2"/>
    <text x="58" y="642" font-size="12" font-weight="700" fill="#111827">HUMAN CHECKPOINT · Is this right?</text>
    <rect x="58" y="652" width="300" height="8" rx="3" fill="#e5e7eb"/>
    <rect x="58" y="666" width="260" height="8" rx="3" fill="#e5e7eb"/>
    <rect x="58" y="682" width="70" height="22" rx="6" fill="#047857"/><text x="70" y="697" font-size="11" fill="#fff">Confirm</text>
    <rect x="136" y="682" width="50" height="22" rx="6" fill="#fff" stroke="#d1d5db"/><text x="146" y="697" font-size="11" fill="#374151">Edit</text>
    <text x="490" y="670" font-size="11" fill="#b45309">← no result until the user confirms</text>

    <!-- result -->
    <rect x="44" y="724" width="430" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="58" y="746" font-size="12" font-weight="700" fill="#92400e">REVIEW · score 4/8</text>
    <rect x="58" y="756" width="330" height="8" rx="3" fill="#fcd34d"/>
    <text x="400" y="786" font-size="13" fill="#374151">[Up] [Down]</text>
    <text x="490" y="764" font-size="11" fill="#b45309">← same rules as /core · thumbs up/down → chat_feedback</text>

    <!-- guardrail -->
    <rect x="44" y="806" width="430" height="54" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="58" y="826" font-size="11" font-weight="700" fill="#475569">SAFETY · I can't recommend medicines or doses</text>
    <rect x="58" y="836" width="300" height="8" rx="3" fill="#cbd5e1"/>

    <!-- input -->
    <rect x="24" y="880" width="640" height="68" rx="0" fill="#f9fafb"/>
    <rect x="44" y="892" width="490" height="34" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="56" y="914" font-size="12" fill="#9ca3af">Type a question…</text>
    <rect x="544" y="892" width="100" height="34" rx="8" fill="#111827"/><text x="574" y="914" font-size="12" fill="#fff">Send</text>
    <text x="44" y="942" font-size="11" fill="#047857" font-weight="700">Finish &amp; save test summary →  (tester code · 1–5 ★ · comment)</text>

    <!-- side panel -->
    <g transform="translate(690,148)">
      <rect width="366" height="150" rx="12" fill="#fff" stroke="#9ca3af" stroke-dasharray="6 4"/>
      <text x="16" y="26" font-size="13" font-weight="700" fill="#111827">Dashboard widget</text>
      <rect x="16" y="40" width="160" height="44" rx="8" fill="#f3f4f6"/><text x="26" y="66" font-size="11" fill="#374151">Sessions saved</text>
      <rect x="190" y="40" width="160" height="44" rx="8" fill="#f3f4f6"/><text x="200" y="66" font-size="11" fill="#374151">Avg rating ★</text>
      <rect x="16" y="92" width="160" height="44" rx="8" fill="#f3f4f6"/><text x="26" y="118" font-size="11" fill="#374151">% thumbs up</text>
      <rect x="190" y="92" width="160" height="44" rx="8" fill="#f3f4f6"/><text x="200" y="118" font-size="11" fill="#374151">Needs review</text>

      <rect y="166" width="366" height="300" rx="12" fill="#fff" stroke="#9ca3af" stroke-dasharray="6 4"/>
      <text x="16" y="192" font-size="13" font-weight="700" fill="#111827">Human review queue</text>
      <text x="16" y="210" font-size="11" fill="#6b7280">emergency · self-harm · Attention · thumbs down · asked for a person · under 18</text>
      <rect x="16" y="222" width="334" height="64" rx="8" fill="#fef2f2"/>
      <rect x="16" y="294" width="334" height="64" rx="8" fill="#f3f4f6"/>
      <rect x="16" y="366" width="334" height="64" rx="8" fill="#f3f4f6"/>

      <rect y="482" width="366" height="318" rx="12" fill="#fff" stroke="#9ca3af" stroke-dasharray="6 4"/>
      <text x="16" y="508" font-size="13" font-weight="700" fill="#111827">Recent test summaries</text>
      <rect x="16" y="522" width="334" height="30" rx="6" fill="#f3f4f6"/>
      <rect x="16" y="560" width="334" height="30" rx="6" fill="#f3f4f6"/>
      <rect x="16" y="598" width="334" height="30" rx="6" fill="#f3f4f6"/>
      <text x="16" y="660" font-size="11" fill="#6b7280">tester · ★ · result · guardrails fired · comment</text>
    </g>
  </g>

  <!-- ===== MOBILE ===== -->
  <g transform="translate(1170,100)">
    <rect width="390" height="800" rx="36" fill="#111827"/>
    <rect x="14" y="14" width="362" height="772" rx="26" fill="#fff"/>
    <text x="34" y="52" font-size="14" font-weight="700" fill="#111827">Vitalis Guide</text>
    <rect x="234" y="36" width="122" height="24" rx="12" fill="#fff" stroke="#111827"/>
    <text x="246" y="53" font-size="11" font-weight="700" fill="#111827">Talk to a person</text>
    <text x="34" y="78" font-size="10" fill="#6b7280">Automated guide · not a doctor · 911</text>

    <rect x="30" y="96" width="250" height="40" rx="12" fill="#f3f4f6"/>
    <text x="42" y="120" font-size="11" fill="#111827">Is any of this happening now?</text>
    <rect x="186" y="146" width="170" height="30" rx="12" fill="#047857"/>
    <text x="200" y="166" font-size="11" fill="#fff">He has chest pain</text>

    <rect x="30" y="190" width="326" height="210" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="46" y="216" font-size="13" font-weight="800" fill="#b91c1c">CALL 911 NOW</text>
    <rect x="46" y="230" width="280" height="8" rx="3" fill="#fca5a5"/>
    <rect x="46" y="246" width="250" height="8" rx="3" fill="#fca5a5"/>
    <rect x="46" y="262" width="270" height="8" rx="3" fill="#fca5a5"/>
    <rect x="46" y="290" width="140" height="36" rx="8" fill="#dc2626"/>
    <text x="70" y="313" font-size="13" font-weight="700" fill="#fff">📞 Call 911</text>
    <text x="46" y="350" font-size="10" fill="#7f1d1d">No numbers asked. Session flagged</text>
    <text x="46" y="364" font-size="10" fill="#7f1d1d">for human review.</text>
    <text x="300" y="388" font-size="12" fill="#374151">[Up] [Down]</text>

    <rect x="30" y="420" width="326" height="60" rx="12" fill="#f8fafc" stroke="#475569"/>
    <text x="44" y="442" font-size="10" font-weight="700" fill="#475569">SAFETY · personal data removed</text>
    <rect x="44" y="452" width="260" height="8" rx="3" fill="#cbd5e1"/>

    <rect x="30" y="700" width="250" height="36" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="42" y="722" font-size="11" fill="#9ca3af">Type a question…</text>
    <rect x="288" y="700" width="68" height="36" rx="8" fill="#111827"/>
    <text x="304" y="722" font-size="11" fill="#fff">Send</text>
    <text x="30" y="760" font-size="10" font-weight="700" fill="#047857">Finish &amp; save test summary</text>
  </g>
  <text x="1170" y="940" font-size="13" fill="#6b7280">Mobile: side panel moves below the chat.</text>
  <text x="1170" y="960" font-size="13" fill="#6b7280">Buttons ≥ 36 px tall for thumbs.</text>
</svg>
